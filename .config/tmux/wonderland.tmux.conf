# Base Colors
set -g status-style "fg=#f6f8fa,bg=#24292e"
set -g message-style "fg=#f6f8fa,bg=#30363d"
set -g message-command-style "fg=#f6f8fa,bg=#30363d"
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#58a6ff"

# Window status
set -g window-status-style "fg=#6a737d,bg=#24292e"
set -g window-status-current-style "fg=#f6f8fa,bg=#30363d,bold"
set -g window-status-activity-style "fg=#f6f8fa,bg=#21262d"

# Window status format
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bold]#I:#W#[default] "

# Command/Copy mode
set -g mode-style "fg=#79c0ff,bg=#1a1f23,bold"

# Bell
set -g bell-action any
set -g window-status-bell-style "fg=#f85149,bg=#36181b,bold"

# Cursor (for compatibility with tmux 3.2+ and some terminals)
# set -g cursor-style block-blink

# Message command prompt
set -g message-command-style "fg=#f6f8fa,bg=#30363d"

# Style active tab with blue, inactive with gray, bell with red
setw -g window-status-current-style "fg=#f6f8fa,bg=#30363d,bold"
setw -g window-status-style "fg=#6a737d,bg=#24292e"
setw -g window-status-bell-style "fg=#f85149,bg=#36181b,bold"

# Clock mode
set -g clock-mode-colour "#58a6ff"
set -g clock-mode-style 24

# Selection in copy mode
set -g copy-mode-match-style "bg=#6e7681,fg=#f6f8fa"
set -g copy-mode-current-match-style "bg=#1f6feb,fg=#f0f6fc,bold"

# Popup border and background (tmux >= 3.2)
set -g popup-border-style "fg=#30363d"
set -g popup-style "bg=#161b22"

# Mode indicators
set -g status-left-length 32
set -g status-right-length 150

# Status bar separators (if patched font is used)
set -g status-left "#[fg=#161b22,bg=#2f81f7,nobold]  #S #[fg=#24292e,bg=default,nobold]#[default]"

# Terminal ANSI colors (for pass-through to shell)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*:Tc"

# Allow for 24-bit color in tmux
set -g allow-passthrough on
