# tmux config

# set the prefix to Alt-a, since its easier to press than C-b
set-option -g prefix M-a
unbind-key M-a
bind-key M-a send-prefix
set -g base-index 1

# set config reload key
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# vi is good
setw -g mode-keys vi

# mouse behavior
setw -g mouse on

# set xterm keys style
set -gw xterm-keys on
set-window-option -g xterm-keys on

# I want to send 

# set screen default color
set -g default-terminal "screen-256color"

# key bindings
bind-key : command-prompt
bind-key r refresh-client
bind-key L clear-history

# windows key bindings
bind-key space next-window
bind-key bspace previous-window
bind-key enter next-layout

# Prefixless bindings using the Alt key
# bind -n M-[ next-window
# bind -n M-] previous-window
bind -n M-] next-window
bind -n M-[ previous-window


# use vim-like keys for splits and windows
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Smart pane switching with awareness of Vim splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# Bindings for windows terminal
bind-key -n C-S-Left if-shell "$is_vim" 'send-keys C-S-Left'  'resize-pane -L 5'
bind-key -n C-S-Down if-shell "$is_vim" 'send-keys C-S-Down'  'resize-pane -D 5'
bind-key -n C-S-Up if-shell "$is_vim" 'send-keys C-S-Up'  'resize-pane -U 5'
bind-key -n C-S-Right if-shell "$is_vim" 'send-keys C-S-Right'  'resize-pane -R 5'

# Bindings for kitty terminal
bind-key -n 'C-S-h' if-shell "$is_vim" 'send-keys C-S-Left'  'resize-pane -L 5'
bind-key -n 'C-S-j' if-shell "$is_vim" 'send-keys C-S-Down'  'resize-pane -D 5'
bind-key -n 'C-S-k' if-shell "$is_vim" 'send-keys C-S-Up'  'resize-pane -U 5'
bind-key -n 'C-S-l' if-shell "$is_vim" 'send-keys C-S-Right'  'resize-pane -R 5'

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind C-l send-keys 'C-l'
#
# copy mode vi
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# window rotation
bind-key C-o rotate-window

# layout switching
bind-key + select-layout main-horizontal
bind-key = select-layout main-vertical

# window sizing
set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80
set-window-option -g display-panes-time 1500

# window and pane movement
bind-key a last-pane
bind-key q display-panes
bind-key c new-window
bind-key t next-window
bind-key T previous-window
bind-key x kill-pane

# copy mode vi
bind-key [ copy-mode
bind-key ] paste-buffer

# Setup v to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Status bar
set-option -g status-interval 1

set-option -g pane-active-border-style fg=yellow
set-option -g pane-border-style fg=cyan

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

# Enable native Mac OS X copy/paste
set-option -g default-command "/bin/bash -c 'which reattach-to-user-namespace >/dev/null && exec reattach-to-user-namespace $SHELL -l || exec $SHELL -l'"

# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0

# don't rename windows automatically
set-option -g allow-rename off

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

source-file ~/.config/tmux/wonderland.tmux.conf

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
